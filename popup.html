<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>B站收藏信息归档</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <div class="brand-row">
      <div id="brandIcon" class="brand-icon">B</div>
      <div>
        <h1>B站收藏信息归档</h1>
        <p class="subtitle">自动归档视频，也可批量导入收藏夹</p>
      </div>
    </div>

    <section class="feature-card">
      <div>
        <div id="enabledLabel" class="feature-title">自动归档已开启</div>
        <p id="enabledHint" class="feature-hint">收藏成功后自动保存视频资料</p>
      </div>
      <button id="toggleEnabled" class="toggle-switch" type="button" aria-label="关闭自动归档" aria-pressed="true"><span></span></button>
    </section>

    <section class="folder-card">
      <div class="section-label">本地保存位置</div>
      <div id="folderName" class="folder-name">尚未选择文件夹</div>
      <button id="chooseFolder" class="primary">选择保存文件夹</button>
      <button id="reauthorizeFolder" class="secondary" hidden>重新授权保存位置</button>
      <p id="permissionHint" class="hint" hidden></p>
      <p class="hint">选择一次后，插件会在其中按收藏夹名称和收藏时间创建目录。</p>
    </section>

    <section class="import-card">
      <button id="openImport" class="primary" type="button">导入到本地</button>
      <div id="importPanel" hidden>
        <div class="import-heading">
          <span class="section-label">选择要导入的收藏夹</span>
          <button id="refreshImportFolders" class="text-button" type="button">刷新</button>
        </div>
        <div id="importFolderList" class="import-folder-list" aria-live="polite">请先打开 B 站个人空间的收藏夹页面。</div>
        <div class="import-selection-actions">
          <button id="selectAllImportFolders" class="text-button" type="button">全选</button>
          <button id="clearImportFolders" class="text-button" type="button">清空</button>
        </div>
        <button id="startImport" class="primary" type="button" disabled>开始导入</button>
        <div id="importStatus" class="import-status" role="status"></div>
      </div>
    </section>

    <section class="status-card">
      <div class="section-label">最近状态</div>
      <div id="lastResult" class="muted">暂无保存记录</div>
      <div id="lastError" class="error-block" hidden>
        <div class="error-title">最近一次错误</div>
        <pre id="errorText"></pre>
        <div id="reportPath" class="report-path"></div>
        <button id="downloadReport" class="secondary">下载错误报告</button>
      </div>
    </section>

    <a class="library-link" href="library.html" target="_blank" rel="noopener">打开本地收藏库 <span aria-hidden="true">↗</span></a>

  <footer>收藏夹导入请在 B 站个人空间的收藏夹页面打开插件。</footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
