<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>image route probe</title>
<style>body{font:12px monospace}div{margin:4px 0}img{width:120px;height:80px;object-fit:cover;background:#eee;border:1px solid #999}span{margin-left:6px}</style>
</head><body>
<script>
const urls = [
  ['live-i2', 'http://i2.hdslb.com/sp/10/10bd74b80ca240b455ffc770f1fa42ef.jpg'],
  ['live-promote', 'http://i1.hdslb.com/promote/7973f7d20baaa6370583d09b95c56b7e.jpg'],
  ['wb-ts', 'http://web.archive.org/web/20150701082208im_/http://i1.hdslb.com/promote/7973f7d20baaa6370583d09b95c56b7e.jpg'],
  ['wb-any', 'http://web.archive.org/web/2015im_/http://i1.hdslb.com/promote/7973f7d20baaa6370583d09b95c56b7e.jpg'],
  ['wb-static', 'http://web.archive.org/web/20150701082208im_/http://static.hdslb.com/images/v3images/icons1.png'],
  ['live-static', 'http://static.hdslb.com/images/v3images/icons1.png'],
];
const out = document.createElement('div');
document.body.appendChild(out);
window.__probe = [];
urls.forEach(([name, u], i) => {
  const d = document.createElement('div');
  d.id = 'probe-' + i;
  const img = new Image();
  img.onload = () => { d.innerHTML = '<b style="color:green">LOAD</b> ' + name + ' ' + img.naturalWidth + 'x' + img.naturalHeight + ' <span>' + u.slice(0, 70) + '</span>'; window.__probe.push([name, 'load', img.naturalWidth]); };
  img.onerror = () => { d.innerHTML = '<b style="color:red">FAIL</b> ' + name + ' <span>' + u.slice(0, 70) + '</span>'; window.__probe.push([name, 'fail']); };
  img.src = u;
  out.appendChild(d);
});
</script>
</body></html>
